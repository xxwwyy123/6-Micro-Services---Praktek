server {
    listen 80;
    server_name localhost;

    location /mahasiswa {
        proxy_pass http://mahasiswa-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /matkul {
        proxy_pass http://matkul-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
